# Source of truth for the glass theme family (VisionOS 26 / Liquid Glass 26).
# Only DESIGN DECISIONS live here. scripts/build_glass_themes.py expands these
# into the full four-layer HA 2026 token set (ha-color-* / wa-* / legacy / ha-card-*).
#
# Never hand-edit the generated themes/*.yaml for these two themes.

variants:
  - key: "VisionOS 26"
    brand: "#FF9F0A"          # Apple systemOrange (dark) — the visionOS accent
    # Background: gradient is the FALLBACK layer, image is layered on top.
    # HACS does not install www/, so the gradient must stand on its own.
    background:
      light:
        gradient: "linear-gradient(160deg, #8c8378 0%, #6f675e 45%, #4a453f 100%)"
        image: "/local/visionos-themes/day.jpg"
      dark:
        gradient: "linear-gradient(160deg, #2a2724 0%, #1a1817 50%, #0d0c0b 100%)"
        image: "/local/visionos-themes/night.jpg"
    glass:
      # tint = the card fill painted on top of the blurred backdrop
      light:  { tint: "rgba(150, 145, 138, 0.30)", rim: "rgba(255, 255, 255, 0.30)" }
      dark:   { tint: "rgba(58, 54, 50, 0.42)",    rim: "rgba(255, 255, 255, 0.22)" }
      blur: "20px"
      saturate: "160%"
    radius: "2xl"             # 24px — visionOS uses large, even radii
    neutral_hue: [138, 132, 124]   # warm grey (visionOS is warm)

  - key: "Liquid Glass 26"
    brand: "#0A84FF"          # Apple systemBlue (dark) — iOS 26 accent
    background:
      light:
        gradient: "linear-gradient(155deg, #dfe6f2 0%, #c3cede 40%, #9fb0c6 100%)"
        image: "/local/visionos-themes/macOS_26_Light.webp"
      dark:
        gradient: "linear-gradient(155deg, #1c2028 0%, #12161d 50%, #07090d 100%)"
        image: "/local/visionos-themes/macOS_26_Dark.webp"
    glass:
      light:  { tint: "rgba(255, 255, 255, 0.42)", rim: "rgba(255, 255, 255, 0.55)" }
      dark:   { tint: "rgba(46, 51, 62, 0.46)",    rim: "rgba(255, 255, 255, 0.20)" }
      blur: "28px"
      saturate: "180%"
    radius: "3xl"             # 28px — iOS 26 is rounder still
    neutral_hue: [134, 142, 156]   # cool grey

# Apple system colours, shared by both variants (dark-mode values; the
# light-mode set is generated by the builder).
status:
  red:        "#FF453A"
  orange:     "#FF9F0A"
  yellow:     "#FFD60A"
  green:      "#32D74B"
  teal:       "#6AC4DC"
  cyan:       "#5AC8F5"
  blue:       "#0A84FF"
  indigo:     "#5E5CE6"
  purple:     "#BF5AF2"
  pink:       "#FF375F"
  brown:      "#AC8E68"
  light-blue: "#66D4CF"

# Emit the optional card-mod block (specular highlight + card de-backing).
# The theme is fully functional WITHOUT card-mod; this only adds the rim
# highlight. card-mod issue #606 breaks YAML theme loading on HA >= 2026.8,
# so this stays off by default.
card_mod: false
