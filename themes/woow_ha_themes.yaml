    .: |
      ha-card {
        backdrop-filter: unset !important;
      }
      ha-card::before {
        content: '';
        position: absolute;
        inset: 0;
        backdrop-filter: var(--ha-card-backdrop-filter);
        z-index: -1;
        pointer-events: none;
        border-radius: inherit;
        box-shadow: var(--ha-card-box-shadow);
      }
      :host(hui-heading-card) ha-card {
        background: none !important;
        backdrop-filter: none !important;
      }
      :host(hui-heading-card) ha-card::before {
        content: none !important;
      }

      /* Energy dashboard sources */
      .mdc-data-table {
        background: none !important;
      }
      .mdc-data-table__row,
      .mdc-data-table__header-cell {
        background: var(--ha-card-background) !important;
      }

      /* Markdown card with text_only */
      ha-card.text-only {
        background: none !important;
        backdrop-filter: none !important;
      }
      ha-card.text-only::before {
        content: none !important;
      }

      /* Mushroom title card */
      :host(mushroom-title-card) ha-card {
        background: none !important;
        backdrop-filter: none !important;
      }
      :host(mushroom-title-card) ha-card::before {
        content: none !important;
      }

      /* Bubble card */
      ha-card.type-custom-bubble-card {
        background: none !important;
        backdrop-filter: none !important;
        box-shadow: none !important;
        border-radius: 0px !important;
      }
      ha-card.type-custom-bubble-card::before {
        content: none !important;
        background: none !important;
        backdrop-filter: none !important;
      }

      /* Mushroom chips card */
      :host(mushroom-chips-card) ha-card {
        background: none !important;
        backdrop-filter: none !important;
        box-shadow: none !important;
      }
      :host(mushroom-chips-card) ha-card::before {
        content: none !important;
        background: none !important;
        backdrop-filter: none !important;
      }
