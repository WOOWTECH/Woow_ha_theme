  primary-font-family: "'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"

  # Energy
  energy-grid-consumption-color: "#f0b830"
  energy-grid-return-color: "#4caf50"
  energy-solar-color: "#ff9800"
  energy-non-fossil-color: "#0d9e6e"
  energy-battery-out-color: "#4db6ac"
  energy-battery-in-color: "#ab47bc"
  energy-gas-color: "#ff5722"
  energy-water-color: "#2196f3"

  # Graph palette
  graph-color-1: "#3d8ef0"
  graph-color-2: "#f0b830"
  graph-color-3: "#0d9e6e"
  graph-color-4: "#e84d60"
  graph-color-5: "#ab47bc"
  graph-color-6: "#ff7043"
  graph-color-7: "#4db6ac"
  graph-color-8: "#7e57c2"
