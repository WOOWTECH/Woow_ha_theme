  h1-font-weight: 100
  h2-font-weight: 100
  h3-font-weight: 100
  h4-font-weight: 600
  h5-font-weight: 400
  h6-font-weight: 400

  body-font: "var(--body-font-weight) var(--body-font-size) var(--font-stack)"
  card-title-font: "var(--card-title-font-weight) var(--card-title-font-size) var(--display-font-stack)"
