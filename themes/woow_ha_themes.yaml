  # Typography
  font-stack: &font-stack "Segoe UI Variable, Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, system-ui, sans-serif"
  display-font-stack: &display-font-stack "Segoe UI Variable Display, Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, system-ui, sans-serif"
  mdc-typography-button-font-family: var(--font-stack)
