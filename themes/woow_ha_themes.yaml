      # ── MDC (Material Design Components) ──
      mdc-theme-primary: "#5aa0f5"
      mdc-theme-secondary: "#f0b830"
      mdc-theme-surface: "#1e2028"
      mdc-theme-on-primary: "#ffffff"
      mdc-theme-on-secondary: "#1a1c20"
      mdc-theme-on-surface: "#e8eaef"

      # ── Data table ──
      data-table-background-color: "#1e2028"

      # ── Scrollbar ──
      scrollbar-thumb-color: "rgba(255, 255, 255, 0.12)"

      # ── Code blocks ──
      markdown-code-background-color: "#2a2c38"
