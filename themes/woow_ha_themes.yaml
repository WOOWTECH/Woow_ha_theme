# ---- source: apporo.yaml ----
apporo:
  # =========================
  # 1) 核心色
  # =========================
  primary-color: "#E4C465"
  accent-color: "#E4C465"
  text-primary-color: "#212121"

  # =========================
  # 1b) 狀態色 (Status colors)
  # =========================
  error-color: "#DB4437"
  warning-color: "#FFA726"
  success-color: "#43A047"
  info-color: "#039BE5"

  # =========================
  # 1c) RGB 變數 (RGB variables)
  # =========================
  rgb-primary-color: "228, 196, 101"
  rgb-accent-color: "228, 196, 101"
  rgb-error-color: "219, 68, 55"
  rgb-warning-color: "255, 167, 38"
  rgb-success-color: "67, 160, 71"
  rgb-info-color: "3, 155, 229"

  # =========================
  # 2) Header / Link
  # =========================
  app-header-background-color: "#54585A"
  link-color: "#95D3ED"

  # =========================
  # 3) Icon（全域預設）
  # =========================
  paper-item-icon-color: "#C7C7C7"
  state-icon-color: "#C7C7C7"
  paper-item-icon-active-color: "#E4C465"
  state-icon-active-color: "#E4C465"
  state-icon-unavailable-color: "#C7C7C7"

  switch-checked-color: "#E4C465"
  slider-color: "#E4C465"

  # =========================
  # 4) 圓角
  # =========================
  card-border-radius: "26px"
  ha-card-border-radius: "26px"
  paper-card-border-radius: "26px"
  dialog-border-radius: "32px"

  # =========================
  # 5) Light / Dark
  # =========================
  modes:

    # =========================
    # 🌕 LIGHT MODE
    # =========================
    light:
      # 背景
      primary-background-color: "#FFFFFF"
      secondary-background-color: "#EDEDED"

      card-background-color: "#E0E0E0"
      paper-card-background-color: "#E0E0E0"
      ha-card-background: "#E0E0E0"

      # 文字
      primary-text-color: "#54585A"
      secondary-text-color: "rgba(84,88,90,0.8)"
      divider-color: "rgba(84,88,90,0.18)"

      # ==================================================
      # 🔥【關鍵】中間卡片 icon → 深色（與 Sidebar 一致）
      # ==================================================
      paper-item-icon-color: "#54585A"
      state-icon-color: "#54585A"

      # Sidebar
      sidebar-background-color: "#D6D6D6"
      sidebar-text-color: "#54585A"
      sidebar-icon-color: "#54585A"

      sidebar-selected-background-color: "rgba(196,158,83,0.30)"
      sidebar-selected-text-color: "#54585A"
      sidebar-selected-icon-color: "#E4C465"

      # ==================================================
      # 子畫面 / More-info Dialog（實心）
      # ==================================================
      dialog-backdrop-filter: "none"
      dialog-backdrop-color: "rgba(0,0,0,0.55)"

      dialog-background-color: "#D0D0D0"
      ha-dialog-card-background-color: "#FFFFFF"

      dialog-primary-text-color: "#54585A"
      dialog-secondary-text-color: "rgba(84,88,90,0.9)"

      dialog-icon-color: "#54585A"
      dialog-icon-active-color: "#E4C465"

      dialog-divider-color: "rgba(84,88,90,0.20)"

      # 狀態色 (Status colors)
      error-color: "#DB4437"
      warning-color: "#FFA726"
      success-color: "#43A047"
      info-color: "#039BE5"

      # RGB 變數 (RGB variables)
      rgb-primary-color: "228, 196, 101"
      rgb-accent-color: "228, 196, 101"
      rgb-primary-text-color: "84, 88, 90"
      rgb-secondary-text-color: "84, 88, 90"
      rgb-card-background-color: "224, 224, 224"
      rgb-error-color: "219, 68, 55"
      rgb-warning-color: "255, 167, 38"
      rgb-success-color: "67, 160, 71"
      rgb-info-color: "3, 155, 229"

      # 捲軸 (Scrollbar)
      scrollbar-thumb-color: "rgba(84,88,90,0.35)"

      # 程式碼編輯器 (Code editor)
      code-editor-background-color: "#F5F5F5"
      markdown-code-background-color: "#F5F5F5"

    # =========================
    # 🌑 DARK MODE
    # =========================
    dark:
      primary-background-color: "#54585A"
      secondary-background-color: "#3F4244"

      card-background-color: "#4A4E50"
      paper-card-background-color: "#4A4E50"
      ha-card-background: "#4A4E50"

      primary-text-color: "#FFFFFF"
      secondary-text-color: "#E0E0E0"
      divider-color: "rgba(255,255,255,0.12)"

      paper-item-icon-color: "#C7C7C7"
      state-icon-color: "#C7C7C7"

      sidebar-background-color: "#3F4244"
      sidebar-text-color: "#C7C7C7"
      sidebar-icon-color: "#C7C7C7"

      sidebar-selected-background-color: "rgba(196,158,83,0.35)"
      sidebar-selected-text-color: "#E4C465"
      sidebar-selected-icon-color: "#E4C465"

      # ==================================================
      # 子畫面 / More-info Dialog（深色模式）
      # ==================================================
      dialog-backdrop-filter: "none"
      dialog-backdrop-color: "rgba(0,0,0,0.65)"

      dialog-background-color: "#3F4244"
      ha-dialog-card-background-color: "#4A4E50"

      dialog-primary-text-color: "#FFFFFF"
      dialog-secondary-text-color: "#E0E0E0"

      dialog-icon-color: "#C7C7C7"
      dialog-icon-active-color: "#E4C465"

      dialog-divider-color: "rgba(255,255,255,0.12)"

      # 狀態色 (Status colors)
      error-color: "#DB4437"
      warning-color: "#FFA726"
      success-color: "#43A047"
      info-color: "#039BE5"

      # RGB 變數 (RGB variables)
      rgb-primary-color: "228, 196, 101"
      rgb-accent-color: "228, 196, 101"
      rgb-primary-text-color: "255, 255, 255"
      rgb-secondary-text-color: "224, 224, 224"
      rgb-card-background-color: "74, 78, 80"
      rgb-error-color: "219, 68, 55"
      rgb-warning-color: "255, 167, 38"
      rgb-success-color: "67, 160, 71"
      rgb-info-color: "3, 155, 229"

      # 捲軸 (Scrollbar)
      scrollbar-thumb-color: "rgba(255,255,255,0.25)"

      # 程式碼編輯器 (Code editor)
      code-editor-background-color: "#3F4244"
      markdown-code-background-color: "#3F4244"

# ---- source: google_theme.yaml ----
# Theme based on Google light and dark mode UI
# Creator: Juan - @juanmtech
# Website: https://www.juanmtech.com
# YouTube Channel: https://youtube.com/juanmtech
# My Home Assistant Config files: https://github.com/JuanMTech/Home_Assistant_files
#
# Updated for Home Assistant 2026.x compatibility
# Fixes applied: Deprecated paper-* variables removed, RGB bug fixed, state colors added
#
Google Theme:
  modes:
    light:
      # Header
      app-header-background-color: rgb(248, 248, 248)
      app-header-text-color: var(--primary-text-color)
      app-header-selection-bar-color: var(--primary-color)
      app-header-edit-background-color: rgb(178, 183, 190)

      # Main Interface Colors
      primary-color: rgb(26, 115, 232)
      light-primary-color: rgb(179, 229, 252)
      dark-primary-color: rgb(2, 136, 209)
      primary-background-color: rgb(248, 248, 248)
      secondary-background-color: rgb(230, 230, 230)
      divider-color: rgba(0, 0, 0, 0.12)
      outline-color: rgba(0, 0, 0, 0.12)
      outline-hover-color: rgba(0, 0, 0, 0.24)
      shadow-color: rgba(0, 0, 0, 0.16)
      accent-color: rgb(26, 115, 232)

      # Status Colors
      error-color: rgb(219, 68, 55)
      warning-color: rgb(255, 166, 0)
      success-color: rgb(67, 160, 71)
      info-color: rgb(3, 155, 229)

      # Text
      primary-text-color: rgb(32, 33, 36)
      secondary-text-color: rgb(95, 99, 104)
      text-primary-color: var(--primary-text-color)
      disabled-text-color: rgba(95, 99, 104, 0.4)

      # Sidebar Menu
      sidebar-icon-color: rgb(95, 99, 104)
      sidebar-text-color: var(--sidebar-icon-color)
      sidebar-background-color: rgb(255, 255, 255)
      sidebar-selected-icon-color: rgb(26, 115, 232)
      sidebar-selected-text-color: var(--sidebar-selected-icon-color)

      # State Icons (modern variables - removed paper-item-icon dependency)
      state-icon-color: rgb(95, 99, 104)
      state-icon-active-color: var(--primary-color)
      state-icon-unavailable-color: var(--disabled-text-color)
      state-active-color: rgb(255, 193, 7)
      state-inactive-color: rgb(158, 158, 158)
      state-unavailable-color: var(--disabled-text-color)

      # Sliders (modern variables - replaced paper-slider-*)
      slider-color: var(--primary-color)
      slider-secondary-color: var(--light-primary-color)
      slider-track-color: rgb(194, 194, 194)
      scrollbar-thumb-color: rgb(194, 194, 194)

      # Labels
      label-badge-background-color: rgb(248, 250, 249)
      label-badge-text-color: var(--primary-text-color)
      label-badge-red: rgb(199, 72, 76)
      label-badge-green: rgb(109, 192, 113)
      label-badge-blue: rgb(26, 115, 232)
      label-badge-yellow: rgb(217, 183, 87)
      label-badge-gray: rgb(95, 98, 103)

      # Cards
      card-background-color: rgb(255, 255, 255)
      ha-card-background: rgb(255, 255, 255)
      ha-card-border-color: rgb(235, 235, 235)

      # Switches
      switch-checked-color: var(--primary-color)
      switch-checked-button-color: rgb(26, 115, 232)
      switch-checked-track-color: rgb(26, 115, 232)
      switch-unchecked-button-color: rgb(189, 193, 198)
      switch-unchecked-track-color: rgb(189, 193, 198)

      # Table
      table-row-background-color: var(--card-background-color)
      table-row-alternative-background-color: var(--primary-background-color)
      data-table-background-color: var(--primary-background-color)

      # Dropdowns and MDC Theme
      material-background-color: var(--card-background-color)
      material-secondary-background-color: var(--primary-background-color)
      mdc-theme-primary: var(--primary-color)
      mdc-theme-secondary: var(--accent-color)
      mdc-theme-surface: var(--card-background-color)
      mdc-theme-background: var(--primary-background-color)
      mdc-theme-on-primary: rgb(255, 255, 255)
      mdc-theme-on-secondary: rgb(255, 255, 255)
      mdc-theme-on-surface: var(--primary-text-color)

      # Pre/Code
      markdown-code-background-color: rgb(242, 242, 242)
      code-editor-background-color: rgb(242, 242, 242)

      # Checkboxes and Radio
      mdc-checkbox-unchecked-color: rgba(32, 33, 36, 0.54)
      mdc-checkbox-disabled-color: var(--disabled-text-color)
      mdc-radio-unchecked-color: rgba(32, 33, 36, 0.54)
      mdc-radio-disabled-color: var(--disabled-text-color)

      # Select/Dropdown
      mdc-select-fill-color: rgb(245, 245, 245)
      mdc-select-ink-color: var(--primary-text-color)
      mdc-select-label-ink-color: var(--secondary-text-color)
      mdc-select-idle-line-color: rgba(0, 0, 0, 0.42)
      mdc-select-dropdown-icon-color: var(--secondary-text-color)
      mdc-select-hover-line-color: var(--accent-color)

      # Text Field
      mdc-text-field-fill-color: rgb(245, 245, 245)
      mdc-text-field-ink-color: var(--primary-text-color)
      mdc-text-field-label-ink-color: var(--secondary-text-color)
      mdc-text-field-idle-line-color: rgba(0, 0, 0, 0.42)
      mdc-text-field-hover-line-color: var(--accent-color)

      # Dialog
      mdc-dialog-heading-ink-color: var(--primary-text-color)
      mdc-dialog-content-ink-color: var(--primary-text-color)
      mdc-dialog-scroll-divider-color: var(--divider-color)

      # Tab
      mdc-tab-text-label-color-default: var(--primary-text-color)

      # Button
      mdc-button-outline-color: var(--outline-color)
      mdc-button-disabled-ink-color: var(--disabled-text-color)

      # Input
      input-fill-color: var(--secondary-background-color)
      input-dropdown-icon-color: var(--secondary-text-color)
      input-ink-color: var(--primary-text-color)
      input-label-ink-color: var(--secondary-text-color)
      input-idle-line-color: rgba(0, 0, 0, 0.42)
      input-hover-line-color: var(--accent-color)

      # RGB Values (FIXED: rgb-primary-color now matches primary-color)
      rgb-primary-text-color: 32, 33, 36
      rgb-primary-color: 26, 115, 232
      rgb-accent-color: 26, 115, 232
      rgb-card-background-color: 255, 255, 255
      rgb-error-color: 219, 68, 55
      rgb-warning-color: 255, 166, 0
      rgb-success-color: 67, 160, 71
      rgb-info-color: 3, 155, 229

#
    dark:
      # Header
      app-header-background-color: rgb(23, 23, 23)
      app-header-text-color: rgb(198, 203, 210)
      app-header-selection-bar-color: var(--primary-color)
      app-header-edit-background-color: rgb(136, 136, 136)

      # Main Interface Colors
      primary-color: rgb(138, 180, 248)
      light-primary-color: rgb(187, 222, 251)
      dark-primary-color: rgb(100, 150, 220)
      primary-background-color: rgb(23, 23, 23)
      secondary-background-color: rgb(32, 33, 36)
      divider-color: rgba(225, 225, 225, 0.12)
      outline-color: rgba(225, 225, 225, 0.12)
      outline-hover-color: rgba(225, 225, 225, 0.24)
      shadow-color: rgba(0, 0, 0, 0.48)
      accent-color: var(--primary-color)

      # Status Colors
      error-color: rgb(242, 139, 130)
      warning-color: rgb(255, 214, 102)
      success-color: rgb(129, 201, 149)
      info-color: rgb(138, 180, 248)

      # Text
      primary-text-color: rgb(242, 242, 242)
      secondary-text-color: rgb(166, 166, 166)
      text-primary-color: var(--primary-text-color)
      disabled-text-color: rgba(184, 190, 199, 0.4)

      # Sidebar Menu
      sidebar-icon-color: rgb(169, 177, 188)
      sidebar-text-color: rgb(198, 203, 210)
      sidebar-background-color: rgb(32, 33, 36)
      sidebar-selected-icon-color: rgb(138, 180, 248)
      sidebar-selected-text-color: var(--sidebar-selected-icon-color)

      # State Icons (modern variables - removed paper-item-icon dependency)
      state-icon-color: rgb(169, 177, 188)
      state-icon-active-color: var(--primary-color)
      state-icon-unavailable-color: var(--disabled-text-color)
      state-active-color: rgb(255, 213, 79)
      state-inactive-color: rgb(117, 117, 117)
      state-unavailable-color: var(--disabled-text-color)

      # Sliders (modern variables - replaced paper-slider-*)
      slider-color: var(--primary-color)
      slider-secondary-color: var(--light-primary-color)
      slider-track-color: rgb(100, 100, 100)
      scrollbar-thumb-color: rgb(100, 100, 100)

      # Labels
      label-badge-background-color: var(--secondary-background-color)
      label-badge-text-color: var(--primary-text-color)
      label-badge-red: rgb(208, 101, 104)
      label-badge-green: rgb(128, 200, 132)
      label-badge-blue: rgb(138, 180, 248)
      label-badge-yellow: rgb(223, 194, 113)
      label-badge-gray: rgb(95, 98, 103)

      # Cards
      card-background-color: rgb(32, 33, 36)
      ha-card-background: rgb(32, 33, 36)
      ha-card-border-color: rgb(42, 43, 46)

      # Switches
      switch-checked-color: var(--primary-color)
      switch-checked-button-color: rgb(138, 180, 248)
      switch-checked-track-color: rgb(138, 180, 248)
      switch-unchecked-button-color: rgb(172, 176, 185)
      switch-unchecked-track-color: rgb(154, 160, 166)

      # Table
      table-row-background-color: var(--primary-background-color)
      table-row-alternative-background-color: var(--secondary-background-color)
      data-table-background-color: var(--primary-background-color)

      # Dropdowns and MDC Theme
      material-background-color: var(--card-background-color)
      material-secondary-background-color: var(--secondary-background-color)
      mdc-theme-primary: var(--primary-color)
      mdc-theme-secondary: var(--accent-color)
      mdc-theme-surface: var(--card-background-color)
      mdc-theme-background: var(--primary-background-color)
      mdc-theme-on-primary: rgb(0, 0, 0)
      mdc-theme-on-secondary: rgb(0, 0, 0)
      mdc-theme-on-surface: var(--primary-text-color)

      # Pre/Code
      markdown-code-background-color: rgb(23, 23, 23)
      code-editor-background-color: rgb(23, 23, 23)

      # Checkboxes and Radio
      mdc-checkbox-unchecked-color: rgba(242, 242, 242, 0.54)
      mdc-checkbox-disabled-color: var(--disabled-text-color)
      mdc-radio-unchecked-color: rgba(242, 242, 242, 0.54)
      mdc-radio-disabled-color: var(--disabled-text-color)

      # Select/Dropdown
      mdc-select-fill-color: rgb(42, 43, 46)
      mdc-select-ink-color: var(--primary-text-color)
      mdc-select-label-ink-color: var(--secondary-text-color)
      mdc-select-idle-line-color: rgba(255, 255, 255, 0.42)
      mdc-select-dropdown-icon-color: var(--secondary-text-color)
      mdc-select-hover-line-color: var(--accent-color)

      # Text Field
      mdc-text-field-fill-color: rgb(42, 43, 46)
      mdc-text-field-ink-color: var(--primary-text-color)
      mdc-text-field-label-ink-color: var(--secondary-text-color)
      mdc-text-field-idle-line-color: rgba(255, 255, 255, 0.42)
      mdc-text-field-hover-line-color: var(--accent-color)

      # Dialog
      mdc-dialog-heading-ink-color: var(--primary-text-color)
      mdc-dialog-content-ink-color: var(--primary-text-color)
      mdc-dialog-scroll-divider-color: var(--divider-color)

      # Tab
      mdc-tab-text-label-color-default: var(--primary-text-color)

      # Button
      mdc-button-outline-color: var(--outline-color)
      mdc-button-disabled-ink-color: var(--disabled-text-color)

      # Input
      input-fill-color: var(--secondary-background-color)
      input-dropdown-icon-color: var(--secondary-text-color)
      input-ink-color: var(--primary-text-color)
      input-label-ink-color: var(--secondary-text-color)
      input-idle-line-color: rgba(255, 255, 255, 0.42)
      input-hover-line-color: var(--accent-color)

      # Map filter for dark mode
      map-filter: invert(0.9) hue-rotate(170deg) brightness(1.5) contrast(1.2) saturate(0.3)

      # RGB Values (FIXED: rgb-primary-color now matches primary-color)
      rgb-primary-text-color: 242, 242, 242
      rgb-primary-color: 138, 180, 248
      rgb-accent-color: 138, 180, 248
      rgb-card-background-color: 32, 33, 36
      rgb-error-color: 242, 139, 130
      rgb-warning-color: 255, 214, 102
      rgb-success-color: 129, 201, 149
      rgb-info-color: 138, 180, 248

