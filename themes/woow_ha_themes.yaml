________________________________________Common Base 3 (Do Not Use): &common-card-mods

  # Card Mod
  card-mod-row-yaml: &card-mod-row |
    .: |
      hui-generic-entity-row {
        padding-top: 4px;
        padding-bottom: 4px;
      }
      .info,
      .info > * {
        white-space: normal !important;
      }
      .secondary {
        font-size: var(--small-font-size);
        line-height: 1.4;
      }
      .state,
      .entity div {
        font-size: var(--h5-font-size);
        font-weight: 400;
      }
    hui-generic-entity-row$: |
      .info,
      .info > * {
        white-space: normal !important;
      }
      .secondary {
        font-size: var(--small-font-size);
        line-height: 1.4;
      }                  
      .state,
      .entity div {
        font-size: var(--h5-font-size);
        font-weight: 400;
      }
      
  card-mod-card-yaml: &card-mod-card |
    .: |
      ha-card {
        --mdc-icon-size: 20px
      }
      ha-card .value {
        font-size: var(--h1-font-size);
        font-weight: var(--h1-font-weight);
        margin-right: 0;
      }
      ha-card .name {
        font-size: var(--body-font-size);
        line-height: var(--body-line-height);
        font-weight: var(--body-font-weight);
        color: var(--primary-text-color);
      }
      ha-card.tile .name {
        white-space: normal;
      }
      ha-card .info {
        line-height: 32px;
        padding-top: 8px;
      }
      ha-card .header {
        padding-top: 16px !important;
      }
      .icon {
        line-height: 16px !important;
      }
      ha-card .measurement {
        font-size: var(--h6-font-size);
        font-weight: 700;
        color: var(--secondary-text-color);
        text-transform: uppercase;
      }
      .card-header,
      .card-header .name,
      :host ::slotted(.card-header),
      ha-card.type-picture-entity .footer.single,
      ha-card.type-media-control hui-marquee {
        font-size: var(--card-title-font-size) !important;
        line-height: var(--card-title-line-height) !important;
        font-weight: var(--card-title-font-weight) !important;
        letter-spacing: 0;
      }
      .card-header,
      :host ::slotted(.card-header) {
        margin-bottom: 8px;
        padding: 12px 16px;
      }
      :host ::slotted(.card-content:not(:first-child)),
      slot:not(:first-child)::slotted(.card-content) {
        margin-top: 0;
      }
      .entities {
        align-items: flex-start !important;
      }
      ha-card.type-button.tile,
      ha-card.type-entity.tile,
      ha-card.type-light.tile,
      ha-card.type-thermostat.tile,
      ha-card.type-gauge.tile,
      :host([narrow]) ha-card.type-weather-forecast.tile {
        aspect-ratio: 1;
      }
      ha-card.type-button.tile.wide,
      ha-card.type-entity.tile.wide,
      ha-card.type-light.tile.wide,
      ha-card.type-thermostat.tile.wide,
      ha-card.type-gauge.tile.wide,
      :host([narrow]) ha-card.type-weather-forecast.tile.wide {
        aspect-ratio: 2;
      }
      ha-card.type-button.tile:has(ha-state-icon[data-state="on"]) {
        background: var(--primary-color);
      }
      ha-card.type-button.tile ha-state-icon {
        width: 33%;
      }
      ha-card.type-button.tile ha-state-icon[data-state="on"] {
        color: var(--primary-text-color) !important;
      }
      ha-card.type-button.tile .state {
        color: var(--secondary-text-color) !important;
        font-size: var(--body-font-size);
        position: absolute;
        bottom: 0;
        right: 0;
        text-align: right;
        padding: 12px;
        width: 33%;
      }
      ha-card.type-button.tile ha-state-icon + span,
      ha-card.type-light.tile #info,
      ha-card.type-thermostat.tile #info,
      ha-card.type-gauge.tile .name {
        font-size: var(--body-font-size);
        position: absolute;
        bottom: 0;
        left: 0;
        text-align: left;
        padding: 12px;
        width: calc(100% - 24px);
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
      }
      ha-card.type-entity.tile {
        flex-direction: column-reverse;
        overflow: hidden;
      }
      ha-card.type-entity.tile .header {
        position: absolute;
        padding: 8px 8px 12px 12px;
        bottom: 0;
        width: calc(100% - 20px);
      }
      ha-card.type-entity.tile .header .icon {
        align-self: flex-end;
      }
      ha-card.type-entity.tile .info {
        order: 3;
        padding: 10px 12px !important;
        margin-top: 0;
      }
      ha-card.type-entity.tile:not(.large) .value {
        font-size: var(--h2-font-size);
      }
      ha-card.type-entity.tile hui-graph-header-footer {
        border-bottom: 48px solid rgba(var(--rgb-accent-color), .1);
      }
      ha-card.type-light.tile .brightness {
        color: var(--secondary-text-color);
        font-size: var(--body-font-size);
        position: absolute;
        right: 12px;
      }
      ha-card.type-light.tile #slider,
      ha-card.type-thermostat.tile #slider {
        max-width: inherit !important;
        min-width: inherit !important;
      }
      ha-card.type-thermostat.tile #slider-center {
        width: 75%;
        height: 75%;
        left: 12.5%;
        top: 12.5%;
      }
      ha-card.type-light.tile #slider ha-icon-button {
        width: 40%;
      }
      ha-card.type-gauge.tile ha-gauge {
        max-width: none;
        padding-bottom: 50%;
      }
      ha-card.type-thermostat.tile #info #modes {
        text-align: center;
      }
      ha-card.type-thermostat.tile #slider-center #temperature text,
      ha-card.type-gauge.tile .value-text {
        font-weight: 100;
      }
      ha-card.type-area {
        padding-bottom: 50%;
      }
      ha-card.type-area .bottom {
        position: absolute;
        padding: 16px 16px 12px 12px !important;
        flex-direction: column-reverse;
        align-items: flex-start;
        width: calc(100% - 28px);
        height: calc(100% - 28px);
      }
      ha-card.type-area .buttons {
        align-self: self-end;
      }
      ha-card.type-area .bottom > div:first-child {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        width: 100%;
      }
      ha-card.type-area .bottom .name {
        align-self: flex-end;
      }
      ha-card.type-area .sensors {
        font-size: var(--body-font-size);
        display: flex;
        --mdc-icon-size: 16px;
        align-items: flex-end;
        gap: 8px;
      }
      ha-card.type-picture-entity .footer {
        background: linear-gradient(to bottom, rgba(var(--rgb-primary-background-color),.75), transparent);
        text-align: left;
        top: 0;
        bottom: auto;
        padding: 12px 12px 48px;
        font-size: var(--body-font-size);
      }
      ha-card.type-picture-entity .footer.both {
        flex-direction: column;
        justify-content: flex-start;
      }
      ha-card.type-picture-entity .footer.both div:nth-child(2) {
        font-size: var(--h1-font-size);
        font-weight: var(--h1-font-weight);
        line-height: 1.4 !important;
      }
      ha-card.type-picture-glance .box {
        padding: 12px;
        background: linear-gradient(to top, rgba(var(--rgb-primary-background-color),.75), transparent);
      }
      ha-card.type-picture-glance .title {
        font-size: var(--body-font-size);
        font-weight: var(--body-font-weight);
        line-height: var(--body-line-height);
        align-self: self-end;
        margin-left: 0;
      }
      ha-card.type-picture-glance .row:nth-child(3) {
        display: none;
      }
      ha-card.type-media-control.tile {
        aspect-ratio: 1
      }
      ha-card.type-media-control.tile .no-img {
        width: 100% !important;
      }
      ha-card.type-media-control.tile .player {
        flex-direction: column-reverse;
        padding-bottom: 16px !important;
      }
      ha-card.type-media-control.tile .title-controls {
        padding-top: 0;
        padding-right: 24px;
      }
      ha-card.type-media-control.tile .media-info {
        padding-bottom: 4px;
      }
      ha-card.type-media-control.tile .controls {
        margin-left: 0 !important;
        padding-inline-end: 0 !important;
      }
      ha-card.type-media-control .icon-name {
        flex-direction: row-reverse;
        width: 100%;
        justify-content: space-between;
      }
      ha-card.type-media-control.tile .icon-name ha-state-icon {
        padding-right: 0;
      }
      ha-card.type-weather-forecast.tile {
        justify-content: space-between;
      }
      ha-card.type-weather-forecast.tile .content {
        flex-direction: row-reverse;
      }
      ha-card.type-weather-forecast.tile .icon-image {
        margin-left: 16px;
        margin-right: 0;
      }
      :host([narrow]) ha-card.type-weather-forecast.tile .info {
        padding-top: 0;
        flex-direction: column;
      }
      ha-card.type-weather-forecast.tile .info {
        padding-top: 0;
      }
      ha-card.type-weather-forecast.tile .state,
      ha-card.type-weather-forecast.tile .temp-attribute .temp {
        font-size: var(--h1-font-size);
        line-height: 1.4;
        font-weight: var(--h1-font-weight);
      }
      ha-card.type-weather-forecast.tile .name-state {
        display: flex;
        flex-direction: column-reverse;
      }
      :host([narrow]) ha-card.type-weather-forecast.tile .state {
        font-size: var(--h1-font-size) !important;
      }
      ha-card.type-weather-forecast.tile .temp-attribute { 
        display: flex;
        align-self: flex-end;
      }
      :host([narrow]) ha-card.type-weather-forecast.tile .temp-attribute { 
        text-align: left;
        flex-direction: row;
        display: flex;
        align-self: flex-start;
      }
      ha-card.type-weather-forecast.tile .temp-attribute .temp {
        font-size: var(--body-font-size);
        font-weight: var(--body-font-weight);
      }
      :host([narrow]) ha-card.type-weather-forecast.tile .temp-attribute .temp {
        font-size: var(--body-font-size);
        font-weight: var(--body-font-weight);
        padding-right: 8px;
      }
      ha-card.type-weather-forecast.tile .temp-attribute .temp span {
        font-size: var(--body-font-size) !important;
        font-weight: var(--body-font-weight) !important;
        color: var(--secondary-text-color);
        top: auto;
      }
      ha-card.type-weather-forecast.tile .name,
      ha-card.type-weather-forecast.tile .attribute {
        font-size: var(--body-font-size) !important;
        line-height: var(--body-line-height);
      }
      ha-card.type-markdown.header {
        background: none;
      }
      ha-markdown {
        padding: 0 12px 16px !important;
      }
      ha-markdown.no-header {
        padding: 16px 12px !important;
      }
    $: |
      .card-header,
      .card-header .name,
      :host ::slotted(.card-header),
      ha-card.type-area .name,
      ha-card.type-picture-entity .footer {
        font-size: var(--card-title-font-size) !important;
        line-height: var(--card-title-line-height) !important;
        font-weight: var(--card-title-font-weight) !important;
        letter-spacing: 0;
      }
    ha-full-calendar$: |
      .header h1 {
        font-size: var(--card-title-font-size);
        line-height: var(--card-title-line-height);
        font-weight: var(--card-title-font-weight);
        letter-spacing: 0;
      }
    statistics-chart$ha-chart-base$: |
      .chartLegend {
        font-size: var(--h6-font-size);
        text-transform: uppercase;
        font-weight: var(--h6-font-weight);
        text-align: left !important;
        padding-bottom: 16px;
      }
      .chartLegend .bullet,
      .chartTooltip .bullet {
        border-radius: 0px;
        border-width: 4px;
        height: 8px;
        width: 8px;
      }
    state-history-charts$state-history-chart-line$ha-chart-base$: |
      .chartLegend {
        font-size: var(--h6-font-size);
        text-transform: uppercase;
        font-weight: var(--h6-font-weight);
        text-align: left !important;
        padding-bottom: 16px;
      }
      .chartLegend .bullet,
      .chartTooltip .bullet {
        border-radius: 0px;
        border-width: 4px;
        height: 8px;
        width: 8px;
      }
    ha-gauge$: |
      .dial,
      .value,
      .level {
        stroke-width: 4 !important;
      }
      .dial {
        stroke: var(--secondary-background-color) !important;
      }
      .text {
        top: 42%;
        font-weight: 100;
      }
      .value-text {
        font-size: var(--h1-font-size);
      }
    ha-markdown$: |
      h1 {
        font-size: var(--title-font-size);
        font-weight: var(--title-font-weight);
        line-height: var(--title-line-height);
      }
      h2 {
        font-size: var(--h2-font-size);
        font-weight: var(--h2-font-weight);
        line-height: var(--h2-line-height);
      }
      h3 {
        font-size: var(--h3-font-size);
        font-weight: var(--h3-font-weight);
        line-height: var(--h3-line-height);
      }
      h4 {
        font-size: var(--h4-font-size);
        font-weight: var(--h4-font-weight);
        line-height: var(--h4-line-height);
      }
      h5 {
        font-size: var(--subtitle-font-size);
        font-weight: var(--subtitle-font-weight);
        line-height: var(--subtitle-line-height);
      }
      h6 {
        font-size: var(--h6-font-size);
        font-weight: var(--h6-font-weight);
        line-height: var(--h6-line-height);
        color: var(--secondary-text-color);
      }


  card-mod-glance-yaml: &card-mod-glance |
    .: |
      state-badge {
        --mdc-icon-size: 32px;
        order: 0;
      }
      div.name {
        font-size: var(--body-font-size);
        color: var(--primary-font-color);
        order: 1 !important;
      }
      div {
        order: 2;
        font-size: var(--small-font-size);
        color: var(--secondary-text-color);
        line-height: 1.33;
        white-space: unset !important;
      }

  card-mod-more-info-yaml: &card-mod-more-info-yaml |
    $: |
      @supports (-webkit-backdrop-filter: none) or (backdrop-filter: none) {
        .mdc-dialog__surface {
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          background-color: rgba(var(--rgb-mdc-theme-surface), .5) !important;
        }
      }
      .mdc-dialog .mdc-dialog__container .mdc-dialog__surface,
      .mdc-dialog .mdc-dialog__content {
        overflow: visible;
      }
      .mdc-dialog__surface {
        box-shadow: 0 0px 16px 4px rgba(var(--dialog-box-shadow), .15), 0 16px 64px 32px rgba(var(--dialog-box-shadow), .5) !important;
      }
    ha-header-bar$: |
      .mdc-top-app-bar {
        background: none !important;
      }
    .: |
      .mdc-top-app-bar__title,
      .main-title {
        text-transform: uppercase;
        font-size: var(--body-font-size);
        font-weight: 600;
        line-height: 1.1;
        overflow: inherit;
        white-space: normal;
        margin-left: -6px;
      }
      .content {
        xmargin-top: -8px;
      }
    ha-more-info-info$state-card-display$: |
      .state {
        margin-left: 46px !important;
        font-size: var(--h1-font-size);
        font-weight: var(--h1-font-weight);
        text-align: left !important;
        line-height: 1.1;
      }
      .layout.horizontal {
        flex-direction: column-reverse !important;
      }
      state-info {
        margin-left: -8px; margin-top: -42px;
      }
    ha-more-info-info$state-card-display$state-info$: |
      .name { display: none; }
      .time-ago { margin-top: 42px; 
        font-size: var(--h6-font-size);
        text-transform: uppercase;}
      state-badge {
        width: 32px !important;
        height: 32px !important;
        border-radius: 0 !important;
        margin: 4px 8px 8px 8px;
      }
      state-badge[icon] {
        margin: 0 0 0 8px !important;
      }
    ha-more-info-info$more-info-default$ha-attributes$: |
      .data-entry { flex-direction: column !important; }
      .key {
        font-size: var(--h6-font-size);
        text-transform: uppercase;
        line-height: 1.1;
      }
      .data-entry .value {
        text-align: left !important;
        font-size: var(--h2-font-size);
        font-weight: var(--h2-font-weight);
        line-height: 1.1;
        margin-bottom: 16px;
        max-width: none !important;
      }
      .data-entry:last-child .value {
        margin-bottom: 0;
      }      
    ha-more-info-history$state-history-charts:
      $:
        state-history-chart-timeline$: |
          .chartTooltip {
            margin-top: -200px;
          }
    ha-more-info-info:
      $:
        ha-more-info-history:
          $: |
            state-history-charts,
            statistics-chart {
              filter: hue-rotate(calc(var(--hue-primary-color) - 212deg)) saturate(3) brightness(0.66)
            }

  card-mod-root-yaml: &card-mod-root |
    .: |
      @supports (-webkit-backdrop-filter: none) or (backdrop-filter: none) {
        app-header,
        app-toolbar {
          background-color: "rgba(var(--rgb-primary-background-color),.33)"
